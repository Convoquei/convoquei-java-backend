app:
  jwt:
    secret-base64: "vS1hkIMbyF75F4RDglgO8GbFq0NFIKlPmRbyAhSoVtU="
    access-token-minutes: 525000
    refresh-token-days: 365

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/convoquei
    username: convoquei
    password: convoquei
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        show_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  show-actuator: true
  group-configs:
    - group: api
      paths-to-match: /**
      paths-to-exclude: /actuator/**
    - group: actuator
      paths-to-match: /actuator/**